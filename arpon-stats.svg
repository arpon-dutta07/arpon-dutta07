<svg width="480" height="210" viewBox="0 0 480 210" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140206"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="480" height="210" rx="14" fill="url(#bgGrad)" stroke="#FF0033" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="6" y="6" width="468" height="198" rx="10" fill="none" stroke="#FF0033" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Title -->
  <text x="25" y="38" font-size="15" fill="#FF0033" font-weight="bold" filter="url(#glow)">🩸 Arpon Dutta's GitHub Stats</text>

  <!-- Rank Badge -->
  <g transform="translate(370, 18)">
    <rect width="85" height="32" rx="16" fill="#1a0006" stroke="#FF0033" stroke-width="1"/>
    <text x="42.5" y="21" font-size="12" fill="#FF0033" font-weight="bold" text-anchor="middle">Rank A+</text>
  </g>

  <!-- Stat Items Grid -->
  <!-- Total Stars -->
  <g transform="translate(25, 65)">
    <circle cx="16" cy="16" r="16" fill="#1a0006" stroke="#FF0033" stroke-opacity="0.4"/>
    <text x="16" y="21" font-size="14" fill="#FF0033" text-anchor="middle">⭐</text>
    <text x="45" y="15" font-size="11" fill="#888">Total Stars Earned</text>
    <text x="45" y="30" font-size="15" fill="#ffffff" font-weight="bold">50+</text>
  </g>

  <!-- Total Commits -->
  <g transform="translate(250, 65)">
    <circle cx="16" cy="16" r="16" fill="#1a0006" stroke="#FF0033" stroke-opacity="0.4"/>
    <text x="16" y="21" font-size="14" fill="#FF0033" text-anchor="middle">💻</text>
    <text x="45" y="15" font-size="11" fill="#888">Total Commits</text>
    <text x="45" y="30" font-size="15" fill="#ffffff" font-weight="bold">500+</text>
  </g>

  <!-- Public Repos -->
  <g transform="translate(25, 135)">
    <circle cx="16" cy="16" r="16" fill="#1a0006" stroke="#FF0033" stroke-opacity="0.4"/>
    <text x="16" y="21" font-size="14" fill="#FF0033" text-anchor="middle">📦</text>
    <text x="45" y="15" font-size="11" fill="#888">Public Repos</text>
    <text x="45" y="30" font-size="15" fill="#ffffff" font-weight="bold">10+</text>
  </g>

  <!-- Followers -->
  <g transform="translate(250, 135)">
    <circle cx="16" cy="16" r="16" fill="#1a0006" stroke="#FF0033" stroke-opacity="0.4"/>
    <text x="16" y="21" font-size="14" fill="#FF0033" text-anchor="middle">👥</text>
    <text x="45" y="15" font-size="11" fill="#888">Followers</text>
    <text x="45" y="30" font-size="15" fill="#ffffff" font-weight="bold">30+</text>
  </g>
</svg>
