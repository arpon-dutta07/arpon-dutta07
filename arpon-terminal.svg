<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0507"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <filter id="termGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor { animation: blink 1s infinite; fill: #FF0033; }
      .prompt { fill: #FF3366; font-weight: bold; }
      .cmd { fill: #FFFFFF; font-weight: bold; }
      .key { fill: #FF4D6D; font-weight: 600; }
      .colon { fill: #888888; }
      .val { fill: #FF85A1; }
      .highlight { fill: #FF0033; font-weight: bold; filter: url(#termGlow); }
    </style>
  </defs>

  <!-- Terminal Container -->
  <rect width="800" height="310" rx="12" fill="url(#termBg)" stroke="#FF0033" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Terminal Header Bar -->
  <path d="M0 12 C0 5.373 5.373 0 12 0 L788 0 C794.627 0 800 5.373 800 12 L800 36 L0 36 Z" fill="#180A0D" stroke="#FF0033" stroke-opacity="0.2" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="18" r="6" fill="#FF5F56"/>
  <circle cx="38" cy="18" r="6" fill="#FFBD2E"/>
  <circle cx="56" cy="18" r="6" fill="#27C93F"/>

  <!-- Window Title -->
  <text x="400" y="23" font-family="'Fira Code', 'Courier New', monospace" font-size="12" fill="#AA5566" text-anchor="middle">arpon@kolkata:~ (bash)</text>

  <!-- Terminal Content -->
  <g font-family="'Fira Code', 'Cascadia Code', Monaco, monospace" font-size="13">
    <!-- Command Line 1 -->
    <text x="25" y="65">
      <tspan class="prompt">arpon@kolkata:~$</tspan>
      <tspan class="cmd"> cat about_me.yml</tspan>
    </text>

    <!-- YAML Content -->
    <text x="25" y="95">
      <tspan class="key">name</tspan><tspan class="colon">: </tspan><tspan class="highlight">Arpon Dutta</tspan>
    </text>

    <text x="25" y="120">
      <tspan class="key">role</tspan><tspan class="colon">: </tspan><tspan class="val">Full-Stack Developer &amp; AI/ML Enthusiast</tspan>
    </text>

    <text x="25" y="145">
      <tspan class="key">education</tspan><tspan class="colon">: </tspan><tspan class="val">B.Tech CS (AI &amp; ML) — Techno India University — CGPA 8.16</tspan>
    </text>

    <text x="25" y="170">
      <tspan class="key">experience</tspan><tspan class="colon">: </tspan><tspan class="val">4+ years freelance (Web Dev, Graphic Design, Video)</tspan>
    </text>

    <text x="25" y="195">
      <tspan class="key">internship</tspan><tspan class="colon">: </tspan><tspan class="val">Web Development Intern @ CodSoft</tspan>
    </text>

    <text x="25" y="220">
      <tspan class="key">building</tspan><tspan class="colon">: </tspan><tspan class="val">macOS Portfolio (React + Vite + TS + Tailwind + Framer)</tspan>
    </text>

    <text x="25" y="245">
      <tspan class="key">location</tspan><tspan class="colon">: </tspan><tspan class="val">Kolkata, India 📍</tspan>
    </text>

    <!-- Command Line 2 with Blinking Cursor -->
    <text x="25" y="280">
      <tspan class="prompt">arpon@kolkata:~$</tspan>
      <tspan class="cursor">█</tspan>
    </text>
  </g>
</svg>
