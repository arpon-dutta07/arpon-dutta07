<svg width="420" height="640" viewBox="0 0 420 640" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace">
  <defs>
    <!-- Strap gradient -->
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0033"/>
      <stop offset="50%" stop-color="#CC0029"/>
      <stop offset="100%" stop-color="#8a0019"/>
    </linearGradient>
    <!-- Card background -->
    <radialGradient id="cardBg" cx="50%" cy="0%" r="110%">
      <stop offset="0%" stop-color="#1a0006"/>
      <stop offset="60%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <!-- Avatar rim light -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FF0033" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF0033" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft shadow -->
    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <!-- Avatar glow -->
    <filter id="avatarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Clip for avatar circle -->
    <clipPath id="avatarClip">
      <circle cx="210" cy="365" r="50"/>
    </clipPath>
    <!-- Name gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
  </defs>

  <!-- ===== LANYARD STRAP ===== -->
  <!-- Strap body -->
  <rect x="192" y="0" width="36" height="228" fill="url(#strapGrad)" rx="2"/>
  <!-- Strap texture / weave pattern -->
  <g opacity="0.15">
    <line x1="197" y1="0" x2="197" y2="228" stroke="#000" stroke-width="0.5"/>
    <line x1="204" y1="0" x2="204" y2="228" stroke="#000" stroke-width="0.5"/>
    <line x1="211" y1="0" x2="211" y2="228" stroke="#000" stroke-width="0.5"/>
    <line x1="218" y1="0" x2="218" y2="228" stroke="#000" stroke-width="0.5"/>
    <line x1="223" y1="0" x2="223" y2="228" stroke="#000" stroke-width="0.5"/>
  </g>
  <!-- Strap embossed text -->
  <g font-size="9" fill="#0a0a0a" font-weight="bold" opacity="0.7">
    <text x="213" y="35" transform="rotate(90 213,35)">ARPON.DEV</text>
    <text x="213" y="85" transform="rotate(90 213,85)">KEEP</text>
    <text x="213" y="120" transform="rotate(90 213,120)">SHIPPING</text>
    <text x="213" y="170" transform="rotate(90 213,170)">ARPON.DEV</text>
  </g>
  <!-- Strap edge highlights -->
  <rect x="192" y="0" width="1" height="228" fill="#FF3355" opacity="0.3"/>
  <rect x="227" y="0" width="1" height="228" fill="#880011" opacity="0.5"/>

  <!-- ===== METAL CLIP ===== -->
  <g>
    <!-- Clip ring -->
    <circle cx="210" cy="236" r="14" fill="none" stroke="#666" stroke-width="4"/>
    <circle cx="210" cy="236" r="14" fill="none" stroke="#888" stroke-width="1.5" opacity="0.3"/>
    <!-- Clip body -->
    <rect x="201" y="246" width="18" height="24" rx="3" fill="#555"/>
    <!-- Clip metal shine -->
    <rect x="204" y="248" width="4" height="20" rx="1" fill="#777" opacity="0.4"/>
    <!-- Clip jaw -->
    <path d="M 199 268 L 221 268 L 219 274 L 201 274 Z" fill="#4a4a4a"/>
    <!-- Spring detail -->
    <circle cx="210" cy="258" r="2" fill="#444" stroke="#555" stroke-width="0.5"/>
  </g>

  <!-- ===== ID CARD ===== -->
  <g filter="url(#cardShadow)">
    <!-- Card body -->
    <rect x="35" y="275" width="350" height="345" rx="16" fill="url(#cardBg)"/>
    <!-- Card border -->
    <rect x="35" y="275" width="350" height="345" rx="16" fill="none" stroke="#FF0033" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- Inner border accent -->
    <rect x="42" y="282" width="336" height="331" rx="13" fill="none" stroke="#FF0033" stroke-opacity="0.08" stroke-width="0.8"/>

    <!-- Card punch hole -->
    <circle cx="210" cy="288" r="5" fill="#050505" stroke="#333" stroke-width="0.8"/>

    <!-- Header row -->
    <text x="60" y="318" font-size="10" fill="#555" letter-spacing="2">DEVELOPER ID</text>
    <text x="360" y="318" font-size="10" fill="#FF0033" text-anchor="end" letter-spacing="1">AD-2026</text>
    <!-- Separator line -->
    <line x1="55" y1="326" x2="365" y2="326" stroke="#FF0033" stroke-opacity="0.15" stroke-width="0.8"/>

    <!-- ===== AVATAR ===== -->
    <!-- Avatar outer ring glow -->
    <circle cx="210" cy="365" r="54" fill="none" stroke="#FF0033" stroke-width="1.5" opacity="0.2" filter="url(#avatarGlow)"/>
    <!-- Avatar background circle -->
    <circle cx="210" cy="365" r="50" fill="#111111" stroke="url(#rimLight)" stroke-width="2"/>

    <!-- Flat-vector portrait (custom illustration based on photo) -->
    <g clip-path="url(#avatarClip)">
      <!-- Background subtle gradient fill -->
      <rect x="160" y="315" width="100" height="100" fill="#120508"/>

      <!-- Neck -->
      <path d="M 197 380 L 223 380 L 225 398 L 195 398 Z" fill="#2a2224"/>
      <!-- Neck shadow under chin -->
      <path d="M 197 380 Q 210 387 223 380 Q 220 376 197 380 Z" fill="#1b1416"/>

      <!-- Shoulders & Kurta (Mandarin collar) -->
      <path d="M 155 425 Q 165 400 188 395 L 198 393 L 222 393 L 232 395 Q 255 400 265 425 Z" fill="#1c1c1c"/>
      <!-- Mandarin / Band collar -->
      <path d="M 196 393 L 196 385 Q 210 382 224 385 L 224 393" stroke="#2a2a2a" stroke-width="2" fill="none"/>
      <path d="M 210 385 L 210 405" stroke="#FF0033" stroke-width="1" opacity="0.6"/> <!-- Kurta placket line -->
      <!-- Kurta pattern accent (subtle geometric diamonds) -->
      <path d="M 175 405 L 180 410 L 175 415 L 170 410 Z" fill="#FF0033" opacity="0.15"/>
      <path d="M 245 405 L 250 410 L 245 415 L 240 410 Z" fill="#FF0033" opacity="0.15"/>

      <!-- Head shape -->
      <path d="M 190 345 Q 186 370 196 382 Q 210 390 224 382 Q 234 370 230 345 Z" fill="#2d2527"/>

      <!-- Beard & Stubble -->
      <path d="M 187 358 Q 185 375 198 385 Q 210 391 222 385 Q 235 375 233 358 Q 231 378 221 385 Q 210 389 199 385 Q 189 378 187 358 Z" fill="#141112"/>
      <path d="M 192 376 Q 210 385 228 376 Q 220 387 210 387 Q 200 387 192 376 Z" fill="#110d0e"/> <!-- Chin beard -->
      <!-- Mustache -->
      <path d="M 200 373 Q 210 370 220 373 Q 210 376 200 373 Z" fill="#141112"/>

      <!-- Ears -->
      <ellipse cx="186" cy="360" rx="3.5" ry="6" fill="#2a2224"/>
      <ellipse cx="234" cy="360" rx="3.5" ry="6" fill="#2a2224"/>

      <!-- Hair (Stylized quiff / voluminous pompadour) -->
      <!-- Hair base silhouette -->
      <path d="M 183 355 Q 180 338 188 326 Q 198 314 212 313 Q 226 314 233 324 Q 238 333 237 355 Q 232 342 227 338 Q 212 334 195 338 Q 188 344 183 355 Z" fill="#0f0d0e"/>
      <!-- Volume layers & waves top -->
      <path d="M 187 330 Q 192 316 208 314 Q 224 316 232 324 Q 222 320 208 321 Q 194 322 187 330 Z" fill="#1d1719"/>
      <path d="M 193 322 Q 205 312 220 314 Q 228 318 233 325 Q 222 317 207 317 Q 198 318 193 322 Z" fill="#251e20"/>

      <!-- Sunglasses (Dark Tinted Aviator / Square Shades) -->
      <!-- Lenses -->
      <path d="M 191 352 L 206 352 Q 208 352 207 357 L 205 365 Q 203 368 198 368 L 193 368 Q 189 367 190 361 Z" fill="#0a0a0d" stroke="#3a3033" stroke-width="0.8"/>
      <path d="M 214 352 L 229 352 Q 231 352 230 361 L 227 368 Q 222 368 217 368 Q 212 367 213 357 Z" fill="#0a0a0d" stroke="#3a3033" stroke-width="0.8"/>
      <!-- Glasses Frame / Top Bar -->
      <path d="M 188 352 L 232 352" stroke="#FF0033" stroke-width="1.2" fill="none" opacity="0.8"/>
      <!-- Lens glare reflections -->
      <line x1="193" y1="354" x2="201" y2="366" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
      <line x1="216" y1="354" x2="224" y2="366" stroke="#ffffff" stroke-width="1" opacity="0.25"/>

      <!-- Red Rim Light (Accenting hair, ear, cheek, and shoulder based on photo) -->
      <path d="M 233 324 Q 238 335 237 355 Q 234 365 232 375 Q 224 385 220 388" stroke="#FF0033" stroke-width="1.5" fill="none" opacity="0.75" filter="url(#glow)"/>
      <path d="M 235 395 Q 255 400 265 425" stroke="#FF0033" stroke-width="1.2" fill="none" opacity="0.5"/>
    </g>

    <!-- ===== NAME & DETAILS ===== -->
    <text x="210" y="438" font-size="22" fill="url(#nameGrad)" text-anchor="middle" font-weight="bold" letter-spacing="0.5">Arpon Dutta</text>

    <!-- Role with letter spacing -->
    <text x="210" y="458" font-size="11" fill="#FF0033" text-anchor="middle" letter-spacing="3" font-weight="bold">FULL-STACK DEVELOPER</text>

    <!-- Handle -->
    <text x="210" y="478" font-size="10" fill="#666" text-anchor="middle">@arpon-dutta07</text>

    <!-- Divider -->
    <g>
      <line x1="80" y1="492" x2="155" y2="492" stroke="#FF0033" stroke-opacity="0.2" stroke-width="0.8"/>
      <circle cx="210" cy="492" r="2" fill="#FF0033" opacity="0.4"/>
      <line x1="265" y1="492" x2="340" y2="492" stroke="#FF0033" stroke-opacity="0.2" stroke-width="0.8"/>
    </g>

    <!-- Tech stack -->
    <g font-size="9.5" fill="#888" text-anchor="middle">
      <text x="210" y="510">React &#183; TypeScript &#183; Python &#183; AI/ML &#183; Node.js</text>
    </g>

    <!-- Separator -->
    <line x1="55" y1="524" x2="365" y2="524" stroke="#FF0033" stroke-opacity="0.1" stroke-width="0.8"/>

    <!-- ===== BARCODE ===== -->
    <g transform="translate(60, 538)">
      <!-- Barcode bars -->
      <rect x="0" y="0" width="5" height="30" fill="#FF0033" opacity="0.9"/>
      <rect x="8" y="0" width="2" height="30" fill="#e6e6e6" opacity="0.8"/>
      <rect x="13" y="0" width="7" height="30" fill="#FF0033" opacity="0.7"/>
      <rect x="23" y="0" width="2" height="30" fill="#e6e6e6" opacity="0.6"/>
      <rect x="28" y="0" width="4" height="30" fill="#FF0033" opacity="0.8"/>
      <rect x="35" y="0" width="3" height="30" fill="#e6e6e6" opacity="0.5"/>
      <rect x="41" y="0" width="8" height="30" fill="#FF0033" opacity="0.6"/>
      <rect x="52" y="0" width="2" height="30" fill="#e6e6e6" opacity="0.7"/>
      <rect x="57" y="0" width="5" height="30" fill="#FF0033" opacity="0.8"/>
      <rect x="65" y="0" width="3" height="30" fill="#e6e6e6" opacity="0.6"/>
      <rect x="71" y="0" width="6" height="30" fill="#FF0033" opacity="0.7"/>
      <rect x="80" y="0" width="2" height="30" fill="#e6e6e6" opacity="0.5"/>
      <rect x="85" y="0" width="4" height="30" fill="#FF0033" opacity="0.9"/>
      <rect x="92" y="0" width="3" height="30" fill="#e6e6e6" opacity="0.6"/>
      <rect x="98" y="0" width="7" height="30" fill="#FF0033" opacity="0.7"/>
      <rect x="108" y="0" width="2" height="30" fill="#e6e6e6" opacity="0.8"/>
      <rect x="113" y="0" width="5" height="30" fill="#FF0033" opacity="0.6"/>
      <rect x="121" y="0" width="3" height="30" fill="#e6e6e6" opacity="0.5"/>
      <rect x="127" y="0" width="4" height="30" fill="#FF0033" opacity="0.8"/>
      <!-- Barcode number -->
      <text x="65" y="42" font-size="7" fill="#444" text-anchor="middle" letter-spacing="2">AD 0726 2026 DEV</text>
    </g>

    <!-- Fun text -->
    <text x="360" y="570" font-size="8" fill="#444" text-anchor="end" font-style="italic">// not draggable, just vibes</text>

    <!-- Corner accents -->
    <path d="M 42 282 L 42 292 M 42 282 L 52 282" stroke="#FF0033" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M 378 282 L 378 292 M 378 282 L 368 282" stroke="#FF0033" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M 42 613 L 42 603 M 42 613 L 52 613" stroke="#FF0033" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M 378 613 L 378 603 M 378 613 L 368 613" stroke="#FF0033" stroke-width="1.5" fill="none" opacity="0.4"/>
  </g>
</svg>
